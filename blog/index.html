<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blog | Belle Allure Aesthetics and Wellness</title>
<meta name="description" content="Tips, insights, and updates from Belle Allure Aesthetics and Wellness in Elkhart, Indiana.">
<link rel="canonical" href="https://belleallureaestheticsandwellness.com/blog/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Figtree',system-ui,sans-serif;color:#2B2B2B;background:#FAFAF8;line-height:1.6}
  a{color:inherit;text-decoration:none}
  /* Nav matching site */
  header{background:#fff;border-bottom:1px solid #E8E4DF;padding:14px 24px}
  header .inner{max-width:1200px;margin:0 auto;display:flex;align-items:center;justify-content:space-between}
  .site-logo{font-family:'Cormorant Garamond',Georgia,serif;font-size:22px;font-weight:700;color:#2B2B2B;letter-spacing:.02em}
  .nav-back{font-size:14px;color:#5E7A65;text-decoration:underline;text-underline-offset:3px}
  /* Page content */
  .blog-hero{padding:60px 24px 40px;text-align:center;max-width:700px;margin:0 auto}
  .blog-hero .eyebrow{font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:#4F6754;margin-bottom:12px}
  .blog-hero h1{font-family:'Cormorant Garamond',Georgia,serif;font-size:clamp(36px,5vw,52px);font-weight:700;color:#2B2B2B;line-height:1.1}
  .blog-grid{max-width:1100px;margin:0 auto;padding:40px 24px 80px;display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:32px}
  .post-card{background:#fff;border:1px solid #E8E4DF;border-radius:12px;overflow:hidden;transition:box-shadow .2s}
  .post-card:hover{box-shadow:0 4px 24px rgba(0,0,0,.08)}
  .post-card img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block}
  .post-card-body{padding:24px}
  .post-date{font-size:12px;color:#6B6B6B;font-weight:500;text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px}
  .post-title{font-family:'Cormorant Garamond',Georgia,serif;font-size:22px;font-weight:700;color:#2B2B2B;margin-bottom:10px;line-height:1.25}
  .post-excerpt{font-size:14px;color:#4A4A4A;line-height:1.6;margin-bottom:16px}
  .post-read-more{font-size:13px;font-weight:600;color:#4F6754;text-decoration:underline;text-underline-offset:3px}
  .no-posts{text-align:center;padding:80px 24px;color:#6B6B6B}
  footer{background:#2B2B2B;color:#fff;text-align:center;padding:28px 24px;font-size:13px}
  footer a{color:#fff;text-decoration:underline;text-underline-offset:3px;margin:0 8px}
</style>
</head>
<body>
<header>
  <div class="inner">
    <a href="/" class="site-logo">Belle Allure</a>
    <a href="/" class="nav-back">Back to site</a>
  </div>
</header>

<div class="blog-hero">
  <p class="eyebrow">From the clinic</p>
  <h1>Tips, Insights & Updates</h1>
</div>

<div class="blog-grid" id="post-list">
  <!-- Posts are loaded dynamically from markdown files in /blog/ -->
  <div class="no-posts" id="no-posts-msg">
    <p>Blog posts coming soon.</p>
  </div>
</div>

<footer>
  <a href="/">Home</a>
  <a href="/services.html">Services</a>
  <a href="/about.html">About</a>
  <a href="/contact.html">Contact</a>
  <p style="margin-top:14px;opacity:.6">&copy; 2025 Belle Allure Aesthetics and Wellness &middot; Elkhart, IN</p>
</footer>

<script>
// Simple blog index -- reads post list from posts.json (generated by GitHub Action)
// Falls back gracefully if the file doesn't exist yet
(async function(){
  try {
    const res = await fetch('/blog/posts.json');
    if (!res.ok) return;
    const posts = await res.json();
    if (!posts.length) return;
    const grid = document.getElementById('post-list');
    document.getElementById('no-posts-msg').remove();
    posts.forEach(function(p){
      const card = document.createElement('article');
      card.className = 'post-card';
      card.innerHTML =
        (p.image ? '<a href="/blog/' + p.slug + '/"><img src="' + p.image + '" alt="' + (p.image_alt||p.title) + '"></a>' : '') +
        '<div class="post-card-body">' +
          '<p class="post-date">' + p.date + '</p>' +
          '<h2 class="post-title"><a href="/blog/' + p.slug + '/">' + p.title + '</a></h2>' +
          '<p class="post-excerpt">' + (p.excerpt||'') + '</p>' +
          '<a class="post-read-more" href="/blog/' + p.slug + '/">Read more</a>' +
        '</div>';
      grid.appendChild(card);
    });
  } catch(e){}
})();
</script>
</body>
</html>
